name: robot
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # 13:00–21:45 UTC = 8:00–16:45 EST / 9:00–17:45 EDT; covers market hours in both; Robot exits fast when closed
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
concurrency:
  group: robot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Robot check
        timeout-minutes: 3
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # No Alpaca keys yet (setup not finished): skip quietly instead of failing every 15 minutes.
        run: |
          if [ -z "$APCA_API_KEY_ID" ]; then echo "No Alpaca keys yet - skipping"; exit 0; fi
          python -m robot.main ${{ inputs.dry_run && '--dry-run' || '' }}
      # always(): a crashed check can still have placed orders and written state.json; save it so the next run does not repeat a trade.
      - name: Save notebook
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "trading-robot"
          git config user.email "trading-robot@users.noreply.github.com"
          git add notebook/state.json notebook/trades.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "robot: check $(date -u +%H:%M) UTC"
          git pull --rebase && git push || (git rebase --abort || true; sleep 5; git pull --rebase && git push)
      - name: Tell Ethan it failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          -d chat_id="${TELEGRAM_CHAT_ID}"
          --data-urlencode text="⚠️ Robot check failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — will retry in 15 min."
          > /dev/null
